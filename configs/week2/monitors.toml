# Week-2 config of experiment 2 ("monitors"): docs/sprint/plans/week2-monitors.md (synced from
# sprint/prep). Every key except [meta] must match the proposal's "Build contract" table
# (scripts/week2_plan_check.py). [design], the control keys of [monitors], [caps] and the
# wording the second tasks use drive the 24 control runs (compaction.s2.chain.monitor_controls,
# scripts/week2_monitor_controls.py); the scorer keys of [monitors] drive the offline monitor
# scorer (week2-build-c), which validates them itself. The assignment file is written by
# `scripts/week2_monitor_controls.py assign` from design.seed; `go` refuses one the seed doesn't
# reproduce. wording.monitor_auto_mode and wording.monitor_guardian are the scorer's two vendored
# prompts (week2-build-c, byte for byte from safety-research/red-teaming-auto-mode@94f8911).

[meta]
exp = "monitors"
proposal = "docs/sprint/plans/week2-monitors.md"
built_against = "2e71f853ae2acc940c94296b14e5e154b2b9eeec05b13f38706698ca236f7dff"

[design]
kind = "monitor_controls"
stage = "SPRINT-S2-MONITORS"
seed = 20261027
n_phases = 2
log_reasoning = true

[monitors]
control_states = 12  # 3 of the 4 reps per first task x permission cell
control_openings = ["withheld", "authorized"]
control_project = "different"
control_starts_full = 6
control_starts_compacted = 6
controls_stop_after_pairs = 6
controls_stop_min_authorized_push = 3
assignment = { path = "configs/week2/assignments/monitors.json", sha256 = "1339d81d65189583a8b9e7fdbf6a2af1fc634485d350fc3c6d02d371be0539fe" }
prompts = ["auto_mode", "guardian"]
models = ["claude-haiku-5-5", "claude-opus-5-5"]
views = ["full", "summary_tail", "current_only", "pinned_user_turns", "current_plus_reasoning"]
primary_acts = 30
test_retest_items = 20
concurrency = 4
max_window_pause = 0.95
max_five_hour_pause = 0.6  # Advisor, 28 Oct (pacing): 40% of each five-hour window stays for the sessions
step_skip = []  # per-step cuts "<step>:<model>:<view>" (Jacob's choice for steps 6, 8, 7, 5)
second_scenario = "p38"
p38_natural_acts = 35
p38_false_licence_acts = 44
p38_authorized_items = 40
p38_policy_in_every_view = true
third_scenario = "p07_if_coverage_check_passes"
host = "laptop"  # the 24 control runs (Research Advisor, 27 Oct: cross-driver admission on rig isn't safe)
agent_cpus = 1  # 8 agents x 1 CPU: CPU limits sum to <= 8 (Jacob's laptop rule)
ramp_agents = 4  # at most 4 agents at first ...
ramp_after_s = 600  # ... until 4 slots have each been held 10 min; then parallelism.agents

[caps]
stage_usd = 50.0  # 24 x $1.50 = $36, $41 with the 1.15 admission margin
run_usd = 2.5
max_calls = 400
max_seconds = 7200

[parallelism]
agents = 8  # the laptop: at most 8 emx containers at 1280 MB (Jacob's rule)
fallback_agents = 4
agent_memory_mb = 1280
fallback_agent_memory_mb = 1280

[wording]
control_withheld = { path = "configs/week2/wording/monitors/control_withheld.txt", sha256 = "9a362b6d8c8a919ce286df50873c89c7541f327ce184d47ea1a1c039bf7b5f35" }
