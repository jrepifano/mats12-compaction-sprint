# Week-2 config of the five-task native-harness chains: docs/sprint/plans/week2-agy-chain5.md. Every key
# except [meta] must match the proposal's "Build contract" table (scripts/week2_plan_check.py).
# Tasks, order, tags, teammate setups, task text and lead-ins are experiment 4's: the runner reads
# them from source_config and refuses wording or orders that differ from it.

[meta]
exp = "agy_chain5"
proposal = "docs/sprint/plans/week2-agy-chain5.md"
built_against = "a2f8b57c2ab8ad26a82080109b0b80f99a4dd35e25c89409c1b86749e1b213a5"

[design]
kind = "native_chain"
stage = "SPRINT-S2-AGY-CHAIN"
seed = 20261027
n_phases = 5
log_reasoning = false  # agy records no reasoning

[native_chain]
harnesses = ["agy", "codex", "claude_code", "agy_sonnet", "claude_code_sonnet"]  # run order (plan v0.4)
agy = { cli_version = "1.4.7", model = "gemini-3.8-flash-low", effort = "low", stage = "SPRINT-S2-AGY-CHAIN", cap_usd = 0.0, task_cap_usd = 0.0, chains = ["u1", "u2", "u3", "u4"] }
codex = { cli_version = "0.162.1", model = "gpt-6-luna", effort = "high", stage = "SPRINT-S2-CX-CHAIN", cap_usd = 0.0, task_cap_usd = 0.0, chains = ["u1", "u2", "u3", "u4"] }
claude_code = { cli_version = "2.1.310", model = "claude-haiku-5-5[1m]", effort = "high", stage = "SPRINT-S2-CC-CHAIN", cap_usd = 35.0, task_cap_usd = 6.0, chains = ["u1", "u2", "u3", "u4"] }
# Sonnet pair (plan v0.4; Jacob: "ok then sonnet and we can asterisk that haiku is not offered")
agy_sonnet = { cli_version = "1.4.7", model = "claude-sonnet-5-5-low", effort = "low", stage = "SPRINT-S2-AGY-SONNET-CHAIN", cap_usd = 0.0, task_cap_usd = 0.0, chains = ["u1", "u2"] }
claude_code_sonnet = { cli_version = "2.1.310", model = "claude-sonnet-5-5", effort = "low", stage = "SPRINT-S2-CC-SONNET-CHAIN", cap_usd = 35.0, task_cap_usd = 6.0, chains = ["u1", "u2"] }
host = "laptop"  # agy's auth volume and the other harnesses' credentials are there
source_config = { path = "configs/week2/chain_stress.toml", sha256 = "e7ecd5aa330c948d7d4f316e53b383880dd44f2c9870865a1a9139097a530102" }
orders = { path = "configs/week2/orders/chain_stress.json", sha256 = "c73fcc4318809fdefce4508b320ee6fe98037d3cb6938b40886deb7592fe7a00" }
chains = ["u1", "u2", "u3", "u4"]
boundary = "native_manual"  # agy /compact, Codex thread/compact/start, Claude Code /compact
end_compaction = true  # one more compaction after the last task (experiment 4's chain end)
compaction_retries = 1
on_compaction_failure = "halt_chain"
auto_compaction = "off_where_possible_logged"  # agy's can't be turned off: logged
session_transfer = "session_file"
save_state = "files_after_every_compaction"  # no kept docker images
grade_phases = true
smoke_chain = "u1"
smoke_phases = 2

[caps]
stage_usd = 70.0  # Claude Code Haiku 35 + Claude Code Sonnet 35 (v0.4.1, Jacob 29 Oct); agy and Codex run on their plans ($0)
run_usd = 6.0  # the Claude Code arms' per-task cost cap
max_calls = 400
max_seconds = 7200

[parallelism]
agents = 4
fallback_agents = 2
agent_memory_mb = 1280
fallback_agent_memory_mb = 3072

[wording]
ticket_tag_line = { path = "configs/week2/wording/chain_stress/ticket_tag_line.txt", sha256 = "0ac0df8bc345e5baf80d08bd83151d014e82e921727d3a18fdbcd739e493a01e" }
