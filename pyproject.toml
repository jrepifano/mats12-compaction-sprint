[project]
name = "emx"
version = "0.1.0"
description = "MATS 12 exploration phase: experiment tooling (prep, judging, analysis, pod runs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "huggingface-hub>=0.24",
    "transformers>=4.57",
    "jinja2>=3.1.6",
    "requests>=2.31",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # CPU-only, for laptop tests on tiny random OLMo-3 models (restore hooks, 2-step trainer)
    "torch>=2.8",
    "peft>=0.17",
]
# Pod-only groups: installed in separate venvs by scripts/pod_setup.sh, never on the laptop.
pod-peft = [
    "torch>=2.8",
    "transformers>=4.57",
    "peft>=0.17",
    "trl>=0.24",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
]
pod-unsloth = [
    "unsloth>=2026.9",
]
vllm = [
    "vllm>=0.11",
]
# I1a (WorkspaceBench reproduction): the benchmark vendored at its pinned commit 92d763e
# (third_party/workspace-bench, see [tool.uv.sources]; installed from source because the wheel
# omits the evals/ item banks), for laptop judging, analysis and the tiny-model tests. A default
# group so `uv run pytest` covers I1a.
i1a = [
    "workspace-bench",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
]
# I1a pod venv (/ws/venv-i1a): the benchmark's own gpu extra plus the reconstructor's needs.
# The olens_draft reconstructor code is vendored under third_party/olens_draft (MIT), not
# installed, because its package pulls a training stack (wandb, datasets, a private trainer).
pod-i1a = [
    "workspace-bench[gpu]",
    "torch>=2.8",
    "transformers>=5.17",
    "peft>=0.19",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "flash-linear-attention>=0.4",
]
# S4 swarm world (laptop): Inspect, pinned to the version our Phase 0 run and the replica used.
# openai<3 / anyio 4.14.2: with openai 3.x every Inspect model call fails at connect
# (`TypeError: float + Timeout`, logs/S4-report.md); X3 implementation plan D1.
swarm = [
    "inspect-ai==0.3.257",
    "openai>=2.54,<3",
    "anyio==4.14.2",
    "pyarrow>=25",  # X3 reads the ImpossibleBench parquet (scripts/x3_prep_tasks.py)
]

[tool.uv.sources]
workspace-bench = { path = "third_party/workspace-bench", editable = true }

[tool.uv]
default-groups = ["dev", "i1a"]
conflicts = [
    [{ group = "pod-peft" }, { group = "pod-unsloth" }, { group = "vllm" }, { group = "pod-i1a" }],
    [{ group = "dev" }, { group = "pod-unsloth" }],
    [{ group = "dev" }, { group = "vllm" }],
    [{ group = "i1a" }, { group = "pod-unsloth" }],
    [{ group = "i1a" }, { group = "vllm" }],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emx", "src/s4world", "src/x3"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: minutes-long end-to-end runs on the tiny model (run with -m slow)"]
addopts = "-m 'not slow'"
