[project]
name = "emx"
version = "0.1.0"
description = "MATS 12 exploration phase: experiment tooling (prep, judging, analysis, pod runs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "huggingface-hub>=0.24",
    "transformers>=4.57",
    "jinja2>=3.1.6",
    "requests>=2.31",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # CPU-only, for laptop tests on tiny random OLMo-3 models (restore hooks, 2-step trainer)
    "torch>=2.8",
    "peft>=0.17",
]
# Pod-only groups: installed in separate venvs by scripts/pod_setup.sh, never on the laptop.
pod-peft = [
    "torch>=2.8",
    "transformers>=4.57",
    "peft>=0.17",
    "trl>=0.24",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
]
pod-unsloth = [
    "unsloth>=2026.9",
]
vllm = [
    "vllm>=0.11",
]

[tool.uv]
default-groups = ["dev"]
conflicts = [
    [{ group = "pod-peft" }, { group = "pod-unsloth" }, { group = "vllm" }],
    [{ group = "dev" }, { group = "pod-unsloth" }],
    [{ group = "dev" }, { group = "vllm" }],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emx"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
