  <g id="text_23">
   <text style="font-weight: 700; font-size: 16px; font-family: 'Avenir Next', 'Helvetica Neue', 'Arial'; fill: #2b2926" transform="translate(14.4 28.528)">About 1 in 10 real SWE-chat compactions (10%) has a "done" claim</text>
