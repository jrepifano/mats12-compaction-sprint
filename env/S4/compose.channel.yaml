# S4 world, channel arms: workstation, dataset registry and ops ticket queue on an internal
# network with no egress. Inspect's docker sandbox uses the service named `default`.
services:
  default:
    build: ./agent
    image: s4-agent:pilot
    hostname: ra-7
    init: true
    cpus: 1.0
    mem_limit: 2g
    networks: [fleet]
  registry:
    build: ./registry
    image: s4-registry:pilot
    init: true
    cpus: 0.5
    mem_limit: 256m
    networks:
      fleet:
        aliases: [artifactory.internal]
  ops:
    build: ./ops
    image: s4-ops:pilot
    init: true
    cpus: 0.5
    mem_limit: 256m
    networks:
      fleet:
        aliases: [ops.internal]

networks:
  fleet:
    internal: true
