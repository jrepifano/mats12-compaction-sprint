# P03: text-proof interpretability items (probes/P03-text-proof-interp-items/plan.md).
# Two pod sessions (log.md 2026-10-11 design): `phase` file = "sample" (vLLM ground truth) then
# "read" (capture + readers on the selected items). gpu_hours is edited between them.
id = "P03"
hard_cap_usd = 45
gpu_limit_usd = 30
api_limit_usd = 20
reserve_usd = 0

[pod]
gpu_hours = 3.0
setup = "i9"
disk_gb = 150
# workspace-bench: the pod-i1a venv installs it from source (setup "i9"); I1a J-Lens readouts:
# session 2 smoke b (p03.read_smoke.JLENS_REF_PATH)
push = ["third_party/workspace-bench", "results/I1a/readouts/jlens/multihop.jsonl"]
env = ["HF_TOKEN"]
poll_minutes = 3
