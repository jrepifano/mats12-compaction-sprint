# P33 filler question-specificity (plan.md). One B300 pod through the generic probe runner
# (P06 F7/F8's V4 Flash path). Starting cap $60 (GPU $55, API $5: literature captures only).
# Follow-ups may raise it to $150 without asking (record the reason in log.md). Raised 2026-10-13
# to $100 (GPU $95): a bad host, an idle pod after the controller died and the API-check stop cost
# ~$25 (log.md), and Stage 2 now runs in the same session as the rest of Stage 1.
id = "P33"
hard_cap_usd = 100
gpu_limit_usd = 95
api_limit_usd = 5
reserve_usd = 0

[pod]
# Session 4 (log.md): V4 only (`args` = --no-gemma; Gemma finished in session 3): download up to
# ~50 min, load + smoke fixes + mask check ~10, resume at item 90 (~211 items, ~68 min), the
# Stage 1 gate, Stage 2 (projection 0.8 s x ~5,800 forwards ~77 min). ~3.4 h; 3.75 h asked.
# Session 3 (log.md): resume V4 at item 90 (~211 items x 19.4 s = 68 min), the Stage 1 gate on
# the pod, Stage 2 on the loaded model if it passes (~60 min), then Gemma (~25 min); download up to
# ~50 min on the slow hosts seen today. Originally (Stage 1 alone): download ~9 min (up to ~45 on a slow host, P06 F7), load and
# compile ~5, mask check ~2, V4 bulk 300 items x 13 arms (~17 s per item from F7's medians,
# ~85 min), then Gemma 4 31B (downloaded in a thread during V4; ~15 min). About 2 h; the run
# stops itself at 1.5x its projection or 12 min before T0 + gpu_hours.
gpu_hours = 3.75
# "i1a": /ws/venv-i1a (transformers 5.17.0, torch 2.13.0 cu130); run.sh adds kernels==0.16.2 as P06.
setup = "i1a"
# V4 Flash 160 GB + its 2 lenses 2.8 GB (P06's download) + Gemma 4 31B 62 GB + venv and caches.
disk_gb = 350
# One Blackwell GPU holds the 160 GB checkpoint; B300 only (P12/P16: peak ~164-170 GB; Gemma is
# loaded after V4 is freed). Rates from RunPod, 2026-10-11.
gpus = [["NVIDIA B300 SXM6 AC", "COMMUNITY", 6.94], ["NVIDIA B300 SXM6 AC", "SECURE", 8.99]]
# third_party/workspace-bench: the pod-i1a group installs it from this path (as P06, P16);
# Brauer's depth-1 set (gitignored, sha256 c80f0f5e...); the p06 code package; P06 F1's V4 API
# rows (the API check compares local base/dots100 with them). The runner sends only src/,
# scripts/ and this probe's directory.
push = ["third_party/workspace-bench", "data/P06/chained_var_binding_dataset.json",
        "probes/P06-filler-token-computation/p06",
        "probes/P06-filler-token-computation/results/stage1/f1_brauer_v4flash.jsonl"]
env = ["HF_TOKEN"]
poll_minutes = 5
