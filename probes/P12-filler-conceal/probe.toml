# P12 filler-conceal (plan.md). One B300 pod through the generic probe runner (P06 F8's V4 Flash
# path). Starting cap $40 (GPU $35, API $5: literature captures only). Follow-ups may raise it to
# $150 without asking (record the reason in log.md).
id = "P12"
hard_cap_usd = 40
gpu_limit_usd = 35
api_limit_usd = 5
reserve_usd = 0

[pod]
# Projected (log.md): download ~8.5 min (up to ~45 on a slow host, P06 F7), load and compile ~5,
# gates ~3, bulk ~40 (200 items x 6 arms x (filler readout ~1.2 s + no-filler ~0.8 s)).
gpu_hours = 2.0
# "i1a": /ws/venv-i1a (transformers 5.17.0, torch 2.13.0 cu130); run.sh adds kernels==0.16.2 as P06.
setup = "i1a"
disk_gb = 300
# P06 F7: one Blackwell GPU holds the 160 GB checkpoint. Rates from RunPod, 2026-10-11.
gpus = [["NVIDIA B300 SXM6 AC", "COMMUNITY", 6.94], ["NVIDIA B300 SXM6 AC", "SECURE", 8.99],
        ["NVIDIA B200", "COMMUNITY", 5.98], ["NVIDIA B200", "SECURE", 7.99]]
# third_party/workspace-bench: the pod-i1a group installs it from this path (as P06);
# Brauer's depth-1 set (gitignored, sha256 c80f0f5e...); P06's code package, which P12 imports
# (the runner sends only src/, scripts/ and this probe's directory; the first relaunch failed
# with "No module named 'p06'", log.md).
push = ["third_party/workspace-bench", "data/P06/chained_var_binding_dataset.json",
        "probes/P06-filler-token-computation/p06"]
env = ["HF_TOKEN"]
poll_minutes = 5
