# P39: binding size control (probes/P39-binding-size-control/plan.md). One pod session:
# capture, gradients, J-lens + rotated-dictionary pursuit, every arm at entity@48 (p39/session.py).
id = "P39"
hard_cap_usd = 15
gpu_limit_usd = 15
api_limit_usd = 0
reserve_usd = 0

[pod]
gpu_hours = 1.0
setup = "i9"
disk_gb = 150
push = [
  "probes/P36-workspace-binding-causal/p36",
  "probes/P36-workspace-binding-causal/data",
  "third_party/workspace-bench",
]
env = ["HF_TOKEN"]
poll_minutes = 5
model_gb = 70
model_repo = "Qwen/Qwen3.6-27B"
model_revision = "6a9e13bd6fc8f0983b9b99948120bc37f49c13e9"
min_download_mb_s = 150
gpu_check = true
rerolls = 2
