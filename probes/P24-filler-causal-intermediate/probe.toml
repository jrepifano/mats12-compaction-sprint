# P24 filler-causal-intermediate (plan.md). One H100 pod through the generic probe runner (P06
# F3's Gemma 4 31B stack). Starting cap $30 (GPU $25, API $5: none planned). Follow-ups may raise
# it to $150 without asking (record the reason in log.md).
id = "P24"
hard_cap_usd = 30
gpu_limit_usd = 25
api_limit_usd = 5
reserve_usd = 0

[pod]
# Projected (plan.md, Cap): download ~6.3 min and load ~0.4 (P06 F3), smoke ~3, pass 1 ~70 min
# (413 items at ~10 s at batch 1's rate), pass 2 ~110 min (cut at the budget's end), pull ~5.
# Main run (2026-10-12): 3.5. Follow-up F2 (eager, 65 items, dots; log.md): 1.25.
gpu_hours = 1.25
# "i1a": /ws/venv-i1a (transformers 5.17.0, torch 2.13.0), the stack P06 F3 loaded this pin with.
setup = "i1a"
# Gemma 4 31B-it ~62 GB + the venv; rows ~50 MB
disk_gb = 150
# No [pod].gpus: the runner's default order (H100 community -> NVL -> secure -> A100 80GB).
# third_party/workspace-bench: the pod-i1a group installs it from this path (as P06, P12);
# Brauer's depth-1 set (gitignored, sha256 c80f0f5e...); P06's code package, which P24 imports
# (the runner sends only src/, scripts/ and this probe's directory; P12's first relaunch failed
# with "No module named 'p06'").
push = ["third_party/workspace-bench", "data/P06/chained_var_binding_dataset.json",
        "probes/P06-filler-token-computation/p06"]
env = ["HF_TOKEN"]
poll_minutes = 5
